name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history so the provenance-manifest gate can verify the committed
      # implementation commit is an ancestor of the PR head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests
      - run: uv run --frozen pytest -q
      - name: Documentation consistency gate (scoped user-facing docs)
        run: uv run --frozen python scripts/docs_consistency_check.py
      - run: uv build
      - name: Release-artifact content policy (wheel + sdist)
        run: uv run --frozen python scripts/artifact_policy_check.py --dist dist --inspect
      - name: Fresh-venv install smoke (wheel only)
        run: uv run --frozen python scripts/artifact_policy_check.py --dist dist --install-smoke
      - run: python -m compileall -q src tests oap/bin scripts
      - run: bash -n oap/bin/*.sh packaging/*.sh

  gateway-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: local
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read current peer authority
        id: peer
        working-directory: local
        run: python scripts/gateway_contract.py --emit-github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.peer.outputs.gateway_repository }}
          ref: ${{ steps.peer.outputs.gateway_commit }}
          path: gateway
          fetch-depth: 1
          persist-credentials: false
      - name: Install minimal contract-test dependencies
        working-directory: local
        run: uv sync --frozen --extra dev --group gateway-contract
      - name: Run strict current Gateway contract gate
        working-directory: local
        env:
          SLAIF_GATEWAY_ROOT: ${{ github.workspace }}/gateway
        run: uv run --frozen python scripts/gateway_contract.py --gateway-root "$SLAIF_GATEWAY_ROOT" --run-tests

  # Order 011-a, workstream C: mandatory Docker qualification (remote
  # evidence). The disposable runner is not a protected host; the canonical
  # port 18031 is used here. The protected-host D6-confined run
  # (172.17.0.1:18032, loopback/docker0 link-local only, no LAN-exposed
  # listener) is the recorded compensating evidence for the host-specific
  # steps that cannot run in hosted CI (C11): protected-host before/after
  # fixture invariance and the docker0 link-local bind class itself.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Build the locked wheel and bind it to the committed manifest
        run: |
          uv build --wheel --out-dir dist
          WHEEL="$(ls dist/slaif_local_coding-*-py3-none-any.whl)"
          WHEEL_SHA256="$(sha256sum "$WHEEL" | cut -d" " -f1)"
          MANIFEST_SHA256="$(uv run --frozen python -c "import json; print(json.load(open('packaging/release_provenance_manifest.json'))['artifacts']['wheel']['sha256'])")"
          echo "fresh wheel sha256:    $WHEEL_SHA256"
          echo "manifest wheel sha256: $MANIFEST_SHA256"
          test "$WHEEL_SHA256" = "$MANIFEST_SHA256"
          echo "SLAIF_WHEEL_SHA256=$WHEEL_SHA256" >> "$GITHUB_ENV"
      # Order 013-k, K1: prove the EXACT release-workflow build command and
      # environment succeed from this fresh disposable CI checkout, with the
      # nonsecret temporary Compose inputs the invocation actually needs
      # (compose.yaml requires SLAIF_LOCAL_CODING_IMAGE at per-file
      # interpolation, before the merge; the env file must exist to load the
      # project). The built image must retain the source/wheel/RC labels.
      # The canonical pull-only compose and its explicit-image requirement
      # are unchanged.
      - name: Prove the release workflow build command (fresh disposable CI checkout)
        run: |
          export SLAIF_GIT_SHA="$GITHUB_SHA"
          export SLAIF_WHEEL_SHA256
          export SLAIF_LOCAL_CODING_IMAGE="slaif-local-coding:0.1.0-${GITHUB_SHA}"
          mkdir -p .ci-build-inputs
          : > .ci-build-inputs/adapter.env
          printf '# build-only placeholder (site config is mounted at runtime)\n' > .ci-build-inputs/adapter.toml
          export SLAIF_ENV_FILE="$GITHUB_WORKSPACE/.ci-build-inputs/adapter.env"
          export SLAIF_CONFIG_FILE="$GITHUB_WORKSPACE/.ci-build-inputs/adapter.toml"
          docker compose -f compose.yaml -f compose.build.yaml build \
            --build-arg SLAIF_QUALIFICATION_LABEL="rc-candidate-0.1.0-rc2; private; not final release"
          docker image inspect "slaif-local-coding:0.1.0-${SLAIF_GIT_SHA}" \
            --format "built image: {{.Id}} (push performed in the next steps)"
          REV="$(docker image inspect "slaif-local-coding:0.1.0-${SLAIF_GIT_SHA}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          WHEEL_LABEL="$(docker image inspect "slaif-local-coding:0.1.0-${SLAIF_GIT_SHA}" --format '{{index .Config.Labels "slaif-local-coding.wheel.sha256"}}')"
          QUAL_LABEL="$(docker image inspect "slaif-local-coding:0.1.0-${SLAIF_GIT_SHA}" --format '{{index .Config.Labels "slaif-local-coding.qualification"}}')"
          test "$REV" = "$GITHUB_SHA"
          test "$WHEEL_LABEL" = "$SLAIF_WHEEL_SHA256"
          test "$QUAL_LABEL" = "rc-candidate-0.1.0-rc2; private; not final release"

      - name: Docker qualification (C2-C9)
        run: |
          uv run --frozen python scripts/docker_qualification_ci.py \
            --tag-sha "$GITHUB_SHA" \
            --full-sha "$GITHUB_SHA" \
            --wheel-sha256 "$SLAIF_WHEEL_SHA256" \
            --adapter-port 18031 \
            --fake-port 18033 \
            --failclosed-port 18034

      # Order 013-a, workstream E: PUBLISHED-image gate, RC-adapted by order
  # 013-i (D14/D15). Order 013-l, L3: the job FIRST records a READ-ONLY
  # authenticated registry baseline (the ephemeral packages:read token, the
  # existing strict resolver: digest / verified-absent / unauthorized are
  # distinct; inaccessible is never reported as absent) for the historical
  # 0.1.0, the two recorded sha- tags, and 0.1.0-rc2 — BEFORE the
  # prepublication gate — so a source round yields the before state and a
  # published round yields the after evidence. The job then authenticates
  # with least-privilege packages:read (GITHUB_TOKEN), consumes the RC
  # record (packaging/rc_record.json, schema slaif-rc-record-v2) or, later,
  # the final release record (packaging/release_record.json), verifies the
  # registry digest, source/wheel/peer/topology labels and configuration
  # identities, then exercises the existing signed-ingress/fail-closed/
  # readiness/no-build/teardown assertions on the PULLED digest on
  # disposable CI only. Before any RC exists it reports the explicit
  # pre-publication NOT RUN state; an invalid record or an inaccessible
  # recorded image FAILS (it never silently skips).
  docker-published:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Order 013-l, L3: READ-ONLY authenticated registry baseline with the
      # job's ephemeral packages:read token, executed BEFORE the
      # prepublication gate (the gate skips every later step while no
      # publication record exists, so this is the only place a source round
      # can record registry truth). Reuses the existing strict resolver
      # (scripts/ghcr_tag_check.tag_digest_strict): digest / verified-absent
      # / unauthorized are distinct outcomes — inaccessible is never
      # reported as absent. No tag mutation, no credential printing, no new
      # token, no new workflow or service.
      - name: Read-only registry baseline (ephemeral packages:read token)
        env:
          SLAIF_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          sys.path.insert(0, "scripts")
          import ghcr_tag_check as registry  # noqa: E402

          out = sys.argv[1]
          token = os.environ.get("SLAIF_GHCR_TOKEN") or None
          repo = "ulfe-lmi/slaif-local-coding"
          tags = (
              "0.1.0",
              "sha-fe334e87c9f0fc65d1826cf9af7dad7e9f70a94a",
              "sha-be3c78b2016d5d40ce9155df8f94d14525c43d39",
              "0.1.0-rc1",
              "sha-4d096e404e14badb78b4f99142bf08ef17f0f8a7",
              "0.1.0-rc2",
          )
          lines = []
          for tag in tags:
              status, digest = registry.tag_digest_strict(repo, tag, token)
              value = f"digest:{digest}" if status == "digest" else status
              name = "tag_" + re.sub(r"[^0-9A-Za-z_-]", "_", tag)
              lines.append(f"{name}={value}")
              print(f"registry baseline {tag} -> {value}")
          # Package visibility via the DIRECT container-package endpoint
          # (order 013-m, M3), with the SAME credential and an explicit
          # supported GitHub API version: the legacy org package-list
          # endpoint targets the legacy docker registry, not GHCR, so its
          # empty list cannot establish GHCR package visibility. The
          # visibility is recorded when the package object is returned;
          # otherwise the exact nonsecret status is recorded as a
          # limitation (a denied optional visibility query is not a repair
          # loop).
          visibility = "unavailable"
          request = urllib.request.Request(
              "https://api.github.com/orgs/ulfe-lmi/packages/container/slaif-local-coding",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  package = json.load(response)
              visibility = str(package.get("visibility"))
          except urllib.error.HTTPError as exc:
              visibility = f"unavailable (HTTP {exc.code})"
          except Exception as exc:  # noqa: BLE001 - exact transport-failure evidence
              visibility = f"unavailable ({type(exc).__name__})"
          lines.append(f"visibility={visibility}")
          print(f"package visibility -> {visibility}")
          with open(out, "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Publication gate (RC record, else final record, else explicit NOT RUN)
        id: gate
        run: |
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          out = sys.argv[1]
          repo = Path.cwd()

          def load_loader():
              spec = importlib.util.spec_from_file_location(
                  "release_provenance_manifest",
                  repo / "scripts" / "release_provenance_manifest.py",
              )
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          gen = load_loader()
          rc_record = gen.load_rc_record(repo)
          release_record = None if rc_record is not None else gen.load_release_record(repo)
          if rc_record is not None:
              kind = "rc"
              digest = rc_record["oci_image_digest"]
              source = rc_record["image_source_commit"]
              tags = rc_record["oci_tags"]
              print(f"publication gate: RC published (digest {digest}, source {source})")
          elif release_record is not None:
              kind = "final"
              digest = release_record["oci_image_digest"]
              source = release_record["image_source_commit"]
              tags = release_record["oci_tags"]
              print(f"publication gate: final published (digest {digest}, source {source})")
          else:
              print("docker-published: NOT RUN (pre-publication: no RC or final publication record)")
              with open(out, "a", encoding="utf-8") as handle:
                  handle.write("published=false\n")
              sys.exit(0)
          with open(out, "a", encoding="utf-8") as handle:
              handle.write(f"published=true\n")
              handle.write(f"kind={kind}\n")
              handle.write(f"digest={digest}\n")
              handle.write(f"source_commit={source}\n")
              handle.write(f"tag0={tags[0]}\n")
              handle.write(f"tag1={tags[1]}\n")
          PY
      - name: Authenticate to GHCR (GITHUB_TOKEN, packages:read only)
        if: steps.gate.outputs.published == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Pull the published image by digest
        if: steps.gate.outputs.published == 'true'
        run: |
          docker pull "ghcr.io/ulfe-lmi/slaif-local-coding@${{ steps.gate.outputs.digest }}"
      - name: Pull by tags and assert each resolves to the recorded digest
        if: steps.gate.outputs.published == 'true'
        run: |
          D="${{ steps.gate.outputs.digest }}"
          T0="${{ steps.gate.outputs.tag0 }}"
          T1="${{ steps.gate.outputs.tag1 }}"
          docker pull "ghcr.io/ulfe-lmi/slaif-local-coding:${T0}"
          docker pull "ghcr.io/ulfe-lmi/slaif-local-coding:${T1}"
          DIGEST_ID="$(docker image inspect "ghcr.io/ulfe-lmi/slaif-local-coding@${D}" --format '{{.Id}}')"
          T0_ID="$(docker image inspect "ghcr.io/ulfe-lmi/slaif-local-coding:${T0}" --format '{{.Id}}')"
          T1_ID="$(docker image inspect "ghcr.io/ulfe-lmi/slaif-local-coding:${T1}" --format '{{.Id}}')"
          test "$T0_ID" = "$DIGEST_ID"
          test "$T1_ID" = "$DIGEST_ID"
          # Order 013-j, J2: the documented operator verification is the
          # registry manifest digest (RepoDigests), not the image .Id alone.
          case "$(docker image inspect "ghcr.io/ulfe-lmi/slaif-local-coding:${T0}" --format '{{range .RepoDigests}}{{.}}{{end}}')" in
            *"ghcr.io/ulfe-lmi/slaif-local-coding@${D}"*) ;;
            *) echo "RepoDigests of ${T0} does not contain the recorded digest" >&2; exit 1 ;;
          esac
          case "$(docker image inspect "ghcr.io/ulfe-lmi/slaif-local-coding:${T1}" --format '{{range .RepoDigests}}{{.}}{{end}}')" in
            *"ghcr.io/ulfe-lmi/slaif-local-coding@${D}"*) ;;
            *) echo "RepoDigests of ${T1} does not contain the recorded digest" >&2; exit 1 ;;
          esac
          export SLAIF_GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          R0="$(python3 scripts/ghcr_tag_check.py --repo ulfe-lmi/slaif-local-coding --tag "${T0}" --strict)"
          R1="$(python3 scripts/ghcr_tag_check.py --repo ulfe-lmi/slaif-local-coding --tag "${T1}" --strict)"
          echo "registry ${T0} -> ${R0}"
          echo "registry ${T1} -> ${R1}"
          test "$R0" = "digest:${D}"
          test "$R1" = "digest:${D}"
      - name: Verify the OCI label set on the published image
        if: steps.gate.outputs.published == 'true'
        run: |
          D="${{ steps.gate.outputs.digest }}"
          S="${{ steps.gate.outputs.source_commit }}"
          docker inspect --format '{{json .Config.Labels}}'             "ghcr.io/ulfe-lmi/slaif-local-coding@${D}" > .ci-published-labels.json
          python3 - "$S" <<'PY'
          import json
          import sys

          source = sys.argv[1]
          labels = json.load(open(".ci-published-labels.json"))
          manifest = json.load(open("packaging/release_provenance_manifest.json"))
          expected = {
              "org.opencontainers.image.revision": source,
              "org.opencontainers.image.version": "0.1.0",
              "slaif-local-coding.package.version": "0.1.0",
              "slaif-local-coding.gateway.peer.sha": manifest["gateway_peer"]["commit"],
              "slaif-local-coding.wheel.sha256": manifest["artifacts"]["wheel"]["sha256"],
              "slaif-local-coding.qualification": manifest["oci"]["labels"][
                  "slaif-local-coding.qualification"
              ],
              "slaif-local-coding.topology.mode": manifest["oci"]["labels"][
                  "slaif-local-coding.topology.mode"
              ],
          }
          failures = {
              k: {"image": labels.get(k), "expected": v}
              for k, v in expected.items()
              if labels.get(k) != v
          }
          if failures:
              raise SystemExit(f"label mismatch: {json.dumps(failures, sort_keys=True)}")
          print("published image label set verified")
          PY
          rm -f .ci-published-labels.json
      - name: Pull-based signed-ingress contract run (fake upstream, canonical port 18031)
        if: steps.gate.outputs.published == 'true'
        run: |
          uv sync --frozen --extra dev
          WHEEL_SHA256="$(python3 -c 'import json; print(json.load(open("packaging/release_provenance_manifest.json"))["artifacts"]["wheel"]["sha256"])')"
          uv run --frozen python scripts/docker_qualification_ci.py --published --wheel-sha256 "$WHEEL_SHA256" --adapter-port 18031 --fake-port 18033 --failclosed-port 18034

  # Order 013-j, J2: prove the DOCUMENTED primary operator lifecycle
  # (QUICKSTART/INSTALL Docker path) in disposable CI with SYNTHETIC secrets
  # and the fake loopback upstream: a local registry:2 stands in for the
  # private GHCR package; the exact documented session (site directory 0700,
  # env/toml 0600, chown 10001:10001, one exported session, digest-form
  # compose pull, RepoDigests verification of the tag form, up/ps/logs with
  # a secret-free log assertion, stop/start/restart/down) is executed and
  # torn down with absence proof. Ordinary install qualification, NOT a
  # benchmark; never touches the protected host.
  operator-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Build the locked wheel and bind it to the committed manifest
        run: |
          uv build --wheel --out-dir dist
          WHEEL="$(ls dist/slaif_local_coding-*-py3-none-any.whl)"
          WHEEL_SHA256="$(sha256sum "$WHEEL" | cut -d" " -f1)"
          MANIFEST_SHA256="$(uv run --frozen python -c "import json; print(json.load(open('packaging/release_provenance_manifest.json'))['artifacts']['wheel']['sha256'])")"
          echo "fresh wheel sha256:    $WHEEL_SHA256"
          echo "manifest wheel sha256: $MANIFEST_SHA256"
          test "$WHEEL_SHA256" = "$MANIFEST_SHA256"
          echo "SLAIF_WHEEL_SHA256=$WHEEL_SHA256" >> "$GITHUB_ENV"
      - name: Documented operator session (disposable; synthetic secrets; fake upstream)
        run: |
          uv run --frozen python scripts/operator_session_ci.py \
            --wheel-sha256 "$SLAIF_WHEEL_SHA256" \
            --full-sha "$GITHUB_SHA" \
            --adapter-port 18031 \
            --fake-port 18033 \
            --registry-port 18040
