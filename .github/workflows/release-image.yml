# ACTIVE container-publication path (order 013-a, workstream D; order 013-c,
# workstream C2).
#
# `workflow_dispatch` ONLY: this workflow can never run on PRs or pushes.
# Registry credential (order 013-c, strategic re-adjudication 3): the
# repository secret SLAIF_GHCR_TOKEN, holding the repository-owner
# org-member classic PAT (scope: repo). The secret is loaded ONLY when this
# workflow is manually dispatched (never on PR/push/branch events); the
# token is never printed (no echo, no unmasked environment dumps). The
# repository Actions workflow-permission ceiling stays `read`: the
# ceiling-raising alternative was explicitly rejected as a persistent,
# repository-wide security-policy broadening.
#
# Procedure (bound to the dispatched commit S):
#   1. build the locked wheel and assert its SHA-256 equals the committed
#      provenance manifest wheel hash (byte-identity law);
#   2. build the release image via the two-file compose (canonical
#      pull-based compose.yaml + qualification override compose.build.yaml)
#      with SLAIF_GIT_SHA = S, SLAIF_WHEEL_SHA256 = the manifest wheel hash,
#      and SLAIF_QUALIFICATION_LABEL = mvp-release-0.1.0;
#   3. authenticate to GHCR with the SLAIF_GHCR_TOKEN secret (org-name
#      username, --password-stdin);
#   4. push the SAME built image as ghcr.io/ulfe-lmi/slaif-local-coding:sha-<S>
#      UNCONDITIONALLY (content-addressed) and as :0.1.0 ONLY if the registry
#      proves the tag is absent or already points at this exact digest (a
#      pre-existing different 0.1.0 digest fails the run — no silent
#      repoint of the release tag);
#   5. verify via the GHCR registry API that BOTH tags resolve to one digest
#      D and emit D in the run log and outputs.
name: Release image (workflow_dispatch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail fast when the registry credential secret is missing
        env:
          SLAIF_GHCR_TOKEN: ${{ secrets.SLAIF_GHCR_TOKEN }}
        run: |
          test -n "$SLAIF_GHCR_TOKEN" || {
            echo "SLAIF_GHCR_TOKEN repository secret is missing or empty; aborting before build" >&2
            exit 1
          }
          echo "SLAIF_GHCR_TOKEN present (value never printed)"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the locked wheel and bind it to the committed manifest
        run: |
          uv build --wheel --out-dir dist
          WHEEL_SHA256="$(sha256sum dist/slaif_local_coding-0.1.0-py3-none-any.whl | cut -d' ' -f1)"
          MANIFEST_SHA256="$(python3 -c 'import json; print(json.load(open("packaging/release_provenance_manifest.json"))["artifacts"]["wheel"]["sha256"])')"
          echo "fresh wheel sha256:    $WHEEL_SHA256"
          echo "manifest wheel sha256: $MANIFEST_SHA256"
          test "$WHEEL_SHA256" = "$MANIFEST_SHA256"
          echo "SLAIF_WHEEL_SHA256=$WHEEL_SHA256" >> "$GITHUB_ENV"
      - name: Build the release image (two-file compose, release qualification label)
        run: |
          export SLAIF_GIT_SHA="$GITHUB_SHA"
          export SLAIF_WHEEL_SHA256
          docker compose -f compose.yaml -f compose.build.yaml build \
            --build-arg SLAIF_QUALIFICATION_LABEL=mvp-release-0.1.0
          docker image inspect "slaif-local-coding:0.1.0-${SLAIF_GIT_SHA}" \
            --format "built image: {{.Id}} (push performed in the next steps)"
      - name: Authenticate to GHCR (SLAIF_GHCR_TOKEN repository secret)
        env:
          SLAIF_GHCR_TOKEN: ${{ secrets.SLAIF_GHCR_TOKEN }}
        run: printf '%s' "$SLAIF_GHCR_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Push tags and registry-verify a single digest
        id: publish
        env:
          SLAIF_GHCR_TOKEN: ${{ secrets.SLAIF_GHCR_TOKEN }}
        run: |
          python3 scripts/release_registry_publish.py \
            --local-image "slaif-local-coding:0.1.0-${GITHUB_SHA}" \
            --git-sha "$GITHUB_SHA" \
            --repo ulfe-lmi/slaif-local-coding
