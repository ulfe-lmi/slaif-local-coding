# Gateway-integrated deployment configuration template (order 010-a, C1).
#
# Label: FINAL Gateway-integrated configuration for the supported production
# path Codex -> Gateway runtime -> Local Coding -> loopback Qwen/vLLM. This is
# the only supported configuration for the Gateway-integrated cutover. The
# disabled-ingress template (config/adapter.deployment.template.toml) is the
# development/local candidate only and is NOT production.
#
# Create the installed configuration (~/.config/slaif-local-coding/adapter.toml,
# mode 0600) by substituting ONLY the documented placeholders below. No other
# manual editing is part of the supported procedure; any additional change
# voids the deployment-qualified evidence.
#
#   __LISTEN_HOST__        adapter bind address (D1 binding law): loopback
#                          127.0.0.1 for the systemd/co-located path; an
#                          interface IP or the all-interfaces literal for the
#                          Docker LAN-visible path. A non-loopback value is
#                          accepted only under the full signed ingress mode
#                          below (the configuration validators fail closed
#                          otherwise).
#   __UPSTREAM_BASE_URL__  private OpenAI-compatible base URL of the protected
#                          vLLM endpoint, e.g. http://127.0.0.1:18020/v1
#   __UPSTREAM_MODEL__     served model name, e.g. qwen3.8-27b
#
# Never place secrets in this file. All three Local-side secret roles are
# referenced by environment name only and must be provided through the
# mode-0600 EnvironmentFile with THREE DISTINCT env names (the config
# validators reject a shared name):
#   QWEN3090_API_KEY            protected upstream (Qwen/vLLM) credential
#   SLAIF_ADAPTER_SERVICE_TOKEN Gateway -> Local service credential
#   SLAIF_ADAPTER_SIGNING_SECRET Gateway -> Local signed-identity HMAC secret
# The Gateway-only identity-derivation secret is never copied to Local.

[server]
listen_host = "__LISTEN_HOST__"
listen_port = 18031
request_body_max_bytes = 67108864
response_body_max_bytes = 67108864
json_max_nesting_depth = 128

[gateway_ingress]
# Final Gateway-integrated ingress: service Bearer plus the signed identity
# contract v1 (policy signed-identity-v1), as continuously tested against the
# pinned Gateway peer (docs/GATEWAY-CONTRACT-CI.md). The Gateway route is the
# sole authorized caller; the fixed defaults below are the accepted contract
# values and are enforced by the configuration validators.
mode = "service_bearer_signed_identity_v1"
service_token_env = "SLAIF_ADAPTER_SERVICE_TOKEN"
signing_secret_env = "SLAIF_ADAPTER_SIGNING_SECRET"
identity_version = "v1"
policy_version = "signed-identity-v1"
clock_skew_seconds = 60
replay_ttl_seconds = 60
max_replay_entries = 4096
nonce_min_length = 16
nonce_max_length = 128

[upstream]
base_url = "__UPSTREAM_BASE_URL__"
api_key_env = "QWEN3090_API_KEY"
model = "__UPSTREAM_MODEL__"
connect_timeout_seconds = 10
request_timeout_seconds = 300
write_timeout_seconds = 30
pool_timeout_seconds = 10

[compiler]
# Required by signed-request constitution identity: direct compiler calls are
# enabled and go directly to upstream; they never traverse the adapter again.
enabled = true
schema_version = "constitution-index-v1"
prompt_policy_version = "constitutional-rank-v2"
reasoning_effort = "low"
timeout_seconds = 120
max_attempts = 2
max_output_tokens = 3000
max_parallel_calls = 1
max_source_bytes = 262144
max_candidates = 128
max_json_depth = 24

[cache]
backend = "filesystem"
# The first run creates this private directory (0700 dir / 0600 files) when
# /dev/shm permits it. Omit this setting to use the protected XDG user-cache
# default instead; the systemd unit must then grant that path via
# ReadWritePaths. Explicit values must be absolute paths outside shared
# world-writable storage.
root = "/dev/shm/slaif-local-coding"
max_total_bytes = 67108864
max_entry_bytes = 65536
max_pinned_bytes = 8388608
max_entries = 4096
ttl_seconds = 604800
max_scan_entries = 4096

[constitution]
# Final Gateway-integrated constitution integration: identity comes from the
# verified signed gateway request; static principal/session/repository labels
# are forbidden (the config validators reject any coexistence).
enabled = true
identity_source = "signed_request"
max_injected_bytes = 16384
candidate_max_count = 128
compile_failure_policy = "preserve_original"
selector_schema_version = "working-set-v1"
render_version = "constitution-render-v1"
working_set_policy_version = "foundation-v1"
working_set_max_entries = 128
acquisition_max_count = 128
max_dependency_acquisitions = 4
entry_render_max_bytes = 8192
injection_max_depth = 64
injection_max_nodes = 16384

[constitution.rehydration]
# Process-local only. State is intentionally lost on restart and never
# persists prompts, source, images, tool output, or request bodies.
enabled = true
ttl_seconds = 3600
max_entries = 64
max_entry_bytes = 262144
max_total_bytes = 1048576

[observation]
schema_version = "observation-v1"
policy_version = "references-v1"
max_roots = 8
max_source_bytes = 262144
max_candidates = 128
max_evidence_per_candidate = 16
max_total_evidence = 1024
max_path_bytes = 512

[[routes]]
name = "qwen38-vision-codex"
model = "__UPSTREAM_MODEL__"
max_images_per_request = 1
image_overflow_policy = "retain_newest"
enable_responses = true
enable_chat_completions = true
# Disabled by default. The compatibility route may explicitly select
# drop_disabled_codex_search to remove only tool_search/web_search declarations.
responses_tool_policy = "passthrough"
# The designated Codex vision route carries the constitutional integration.
observation_enabled = true
constitution_enabled = true

[observability]
log_level = "INFO"
log_raw_payloads = false
metrics_enabled = true
metrics_host = "127.0.0.1"
