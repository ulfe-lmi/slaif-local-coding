# Example only. Never place secrets in this file.

[server]
listen_host = "127.0.0.1"
listen_port = 18031
request_body_max_bytes = 67108864
json_max_nesting_depth = 128

[upstream]
base_url = "http://127.0.0.1:18020/v1"
api_key_env = "QWEN3090_API_KEY"
model = "qwen3.8-27b"
connect_timeout_seconds = 10
request_timeout_seconds = 300
write_timeout_seconds = 30
pool_timeout_seconds = 10

[compiler]
# Direct compiler calls remain disabled unless constitution integration is
# explicitly enabled both here and on a route.
enabled = false
# Compiler calls go directly to upstream and never traverse the adapter again.
schema_version = "constitution-index-v1"
prompt_policy_version = "constitutional-rank-v2"
reasoning_effort = "low"
timeout_seconds = 120
max_attempts = 2
max_output_tokens = 3000
max_parallel_calls = 1
max_source_bytes = 262144
max_candidates = 128
max_json_depth = 24

[cache]
backend = "filesystem"
# The first run creates this private directory when /dev/shm permits it.
root = "/dev/shm/slaif-local-coding"
# Omit this setting to use the protected XDG user-cache default. An explicit
# value must be an absolute path outside shared world-writable storage.
max_total_bytes = 67108864
max_entry_bytes = 65536
max_pinned_bytes = 8388608
max_entries = 4096
ttl_seconds = 604800
max_scan_entries = 4096

[constitution]
# Explicit local-appliance single-user MVP integration. When enabling it, also
# set compiler.enabled = true, nonempty principal/session/repository labels,
# observation_enabled = true, and constitution_enabled = true on one route.
# These labels are configuration values, never caller-supplied identity.
enabled = false
max_injected_bytes = 16384
candidate_max_count = 128
compile_failure_policy = "preserve_original"
selector_schema_version = "working-set-v1"
render_version = "constitution-render-v1"
working_set_policy_version = "foundation-v1"
working_set_max_entries = 128
acquisition_max_count = 128
max_dependency_acquisitions = 4
entry_render_max_bytes = 8192
injection_max_depth = 64
injection_max_nodes = 16384

[observation]
schema_version = "observation-v1"
policy_version = "references-v1"
max_roots = 8
max_source_bytes = 262144
max_candidates = 128
max_evidence_per_candidate = 16
max_total_evidence = 1024
max_path_bytes = 512

[[routes]]
name = "qwen38-vision-codex"
model = "qwen3.8-27b"
max_images_per_request = 1
image_overflow_policy = "retain_newest"
enable_responses = true
enable_chat_completions = true
observation_enabled = true
constitution_enabled = false

[observability]
log_level = "INFO"
log_raw_payloads = false
metrics_enabled = true
metrics_host = "127.0.0.1"
