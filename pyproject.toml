# Deterministic HERMETIC build environment (order 013-i, C9; completed by
# order 013-j, J3): EVERY build dependency — the backend and its resolved
# dependency set — is pinned exactly. hatchling==1.32.0 is the version proven
# to reproduce the objective-013 published wheel
# 879baa3ad19e0f513090add965d267957d27f7bcd904d1e225586d76126f8b19 (and sdist
# 5a60cd6ef41764f16871fd0134b6c234409ba2708b3159bdc0863fc84e7e520f; the
# 013-i report's shortened transcription of that sdist hash is corrected
# here, order 013-j, J6) from the clean published source tree in isolated
# build environments (Python 3.12.3 and 3.12.14, uv 0.12.5). The unpinned
# `hatchling>=1.27` form resolved to hatchling 1.32.3 in CI on 2026-09-20
# and changed the wheel bytes (observed drift
# 9bf64a47d5c010d00177b31bd82e2db8ec36f505b2e10d02315789590ee2bd84), so the
# backend is pinned exactly. The recorded build environment in the provenance
# manifest `build` section is asserted to equal these exact pins on every
# generation (mechanical binding; drift fails), and the pinned set equals the
# observed isolated-build resolution. uv (0.12.5) and the pinned base-image
# identities complete the toolchain pin (see
# docs/RELEASE-ARTIFACT-POLICY.md). These are BUILD-time dependencies only;
# they do not change runtime dependencies or uv.lock.
[build-system]
requires = [
  "hatchling==1.32.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.6.1.19",
]
build-backend = "hatchling.build"

[project]
name = "slaif-local-coding"
version = "0.1.0"
description = "Private OpenAI-compatible adapter for constrained local models"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[dependency-groups]
gateway-contract = [
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2,<3",
]

[project.scripts]
slaif-local-coding = "slaif_local_coding.cli:main"

# Release-artifact policy (order 009-a, docs/RELEASE-ARTIFACT-POLICY.md):
# the wheel is the single supported distributable; the sdist is a
# developer-only source archive. Both targets get an explicit, deliberate
# include/exclude policy below instead of backend defaults.
[tool.hatch.build]
# Top-level exclusions apply to every build target. Orchestration transcripts,
# OAP runtime state, caches, build outputs, placeholder files, and files that
# embed protected-host-specific paths must never enter any artifact.
exclude = [
  ".git",
  ".venv",
  "dist",
  "build",
  "oap",
  "references",
  "scripts",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "__pycache__",
  "**/__pycache__",
  "*.pyc",
  "*.pyo",
  "*.egg-info",
  "Local",
  "clean",
  "unchanged",
  "runtime.env",
  "AGENTS.md",
  "OAP-COMMUNICATION-coding-agent.md",
  "ARCHITECTURE-for-agents.md",
  "SECURITY.md",
  "TESTING.md",
  "ARCHITECTURE.md",
  "docs/LIVE-TEST-ENVIRONMENT.md",
  "docs/OAP-RUNBOOK.md",
  "docs/SLAIF-GATEWAY-INTEGRATION.md",
  # Static repo-asset contract tests that embed the forbidden-content
  # scanner's literal patterns (meta-content), plus host-specific tests.
  "tests/test_packaging.py",
  "tests/test_config.py",
  "tests/test_gateway_accounting_rehearsal.py",
  "tests/test_safe_evidence.py",
  "tests/test_artifact_policy.py",
  # The manifest hashes the artifacts, so it (and its schema) stay in git
  # and are never part of any artifact (no self-hash fixed point needed).
  "packaging/release_provenance_manifest.json",
  "packaging/release_provenance_manifest.schema.json",
  # The post-publication RC artifact record is publication metadata written
  # AFTER the source freeze (order 013-i, C11); it must never enter a
  # wheel/sdist/image build input (self-reference exclusion).
  "packaging/rc_record.json",
  # The deterministically rendered human-readable RC handoff is generated at
  # publication from the RC record (order 013-j, J5); it is post-publication
  # metadata and must never be an artifact input (recording a digest must
  # not require another image).
  "packaging/rc_handoff.md",
  # Immutable records of superseded candidates are metadata, not build inputs.
  "packaging/releases",
]

[tool.hatch.build.targets.wheel]
# Verified-clean property: runtime package plus dist-info metadata and license
# files only. The mechanical policy check (scripts/artifact_policy_check.py)
# re-proves this on every build in local gates and CI.
packages = ["src/slaif_local_coding"]

[tool.hatch.build.targets.sdist]
# Deliberate developer-only whitelist; the complement of this list (plus the
# top-level exclusions) is never shipped in the sdist.
include = [
  "pyproject.toml",
  "uv.lock",
  "README.md",
  "QUICKSTART.md",
  "INSTALL.md",
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "CONTRIBUTING.md",
  "src",
  "config",
  "packaging",
  "tests",
  "docs",
  ".github/workflows/ci.yml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"oap/bin/check_state.py" = ["E501", "UP022"]
"references/qwen38_vision_image_cap_proxy.py" = ["E501"]

[tool.ruff.format]
exclude = ["oap/bin/check_state.py", "references/qwen38_vision_image_cap_proxy.py"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["slaif_local_coding"]

# Repository-only OAP tooling exercised by tests (order 010-a); resolved at
# runtime via sys.path in the test module.
[[tool.mypy.overrides]]
module = "cutover_state_machine"
ignore_missing_imports = true
